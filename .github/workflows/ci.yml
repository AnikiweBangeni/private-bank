name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore a-private-bank-main.sln
      - run: dotnet format a-private-bank-main.sln --verify-no-changes --no-restore
      - run: dotnet build a-private-bank-main.sln --configuration Release --no-restore
